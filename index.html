<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Reset</title>
<meta name="description" content="Private personal dashboard. All data stays on this device.">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">

<body>

<dialog id="sheet" aria-label="Dialog"><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
